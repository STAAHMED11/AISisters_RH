services:
  app:
    build: .
    ports: ["3000:3000"]          # Next.js UI; /api is proxied to Flask inside the container
    env_file: .env
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    volumes: ["orvane-data:/data"]
    restart: unless-stopped
volumes:
  orvane-data:
